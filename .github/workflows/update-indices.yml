name: Actualizar indices (SPY/QQQ) y precios de carteras
on:
  schedule:
    - cron: "30 22 * * 1-5"   # dias habiles, ~19:30 ET (despues del cierre de EE.UU.)
  workflow_dispatch:           # permite correrlo a mano
  push:
    paths:
      - "tickers.txt"          # si agregás un ticker, se regenera solo
      - "update_precios.py"
      - "update_dolares.py"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generar data/indices.json
        run: python update_indices.py
      - name: Generar data/precios.json
        continue-on-error: true    # si falla, indices.json se publica igual
        run: python update_precios.py
      - name: Generar data/dolares.json
        continue-on-error: true
        run: python update_dolares.py
      - name: Commit si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indices.json
          if [ -f data/precios.json ]; then git add data/precios.json; fi
          if [ -f data/dolares.json ]; then git add data/dolares.json; fi
          git diff --staged --quiet || git commit -m "indices/precios $(date -u +%F)"
          git push
